name: Release

# Pushing a tag such as v1.2.0 builds sshelfy.exe and publishes a GitHub release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version from the tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/Sshelfy.App/Sshelfy.App.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=embedded `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:InformationalVersion="${{ steps.version.outputs.version }}+${{ github.sha }}" `
            -o artifacts/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory artifacts/release | Out-Null
          Copy-Item artifacts/publish/sshelfy.exe "artifacts/release/sshelfy-${{ steps.version.outputs.version }}-win-x64.exe"
          Compress-Archive -Path artifacts/publish/sshelfy.exe, LICENSE, THIRD-PARTY-NOTICES.md `
            -DestinationPath "artifacts/release/sshelfy-${{ steps.version.outputs.version }}-win-x64.zip"
          Get-ChildItem artifacts/release | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content artifacts/release/SHA256SUMS.txt

      - name: Release notes from the changelog
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]").LineNumber
          if ($start) {
            $rest = $lines[$start..($lines.Count - 1)]
            $end = ($rest | Select-String -Pattern '^## \[').LineNumber | Select-Object -First 1
            $notes = if ($end) { $rest[0..($end - 2)] } else { $rest }
          } else {
            $notes = @("See CHANGELOG.md.")
          }
          $notes | Set-Content artifacts/notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" artifacts/release/* `
            --title "sshelfy ${{ steps.version.outputs.version }}" --notes-file artifacts/notes.md
