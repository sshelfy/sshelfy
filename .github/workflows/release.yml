name: Release

# Pushing a tag such as v1.2.0 builds sshelfy for Windows and Linux and publishes a GitHub release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version from the tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/Sshelfy.App/Sshelfy.App.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=embedded `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:InformationalVersion="${{ steps.version.outputs.version }}+${{ github.sha }}" `
            -o artifacts/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory artifacts/release | Out-Null
          Copy-Item artifacts/publish/sshelfy.exe "artifacts/release/sshelfy-${{ steps.version.outputs.version }}-win-x64.exe"
          Compress-Archive -Path artifacts/publish/sshelfy.exe, LICENSE, THIRD-PARTY-NOTICES.md `
            -DestinationPath "artifacts/release/sshelfy-${{ steps.version.outputs.version }}-win-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/release/*
          if-no-files-found: error

  linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The Windows job runs every test; here the unit tests check the Linux build of the core.
      - name: Test
        run: dotnet test tests/Sshelfy.Core.Tests -c Release

      - name: Publish
        run: |
          version="${{ steps.version.outputs.version }}"
          dotnet publish src/Sshelfy.App/Sshelfy.App.csproj -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=embedded \
            -p:Version="$version" -p:InformationalVersion="$version+${{ github.sha }}" \
            -o artifacts/publish

          # One folder in the archive, so extracting it never spills files into the current directory.
          name="sshelfy-$version-linux-x64"
          mkdir -p "artifacts/$name" artifacts/release
          cp artifacts/publish/sshelfy packaging/linux/sshelfy.desktop packaging/linux/install.sh \
            LICENSE THIRD-PARTY-NOTICES.md "artifacts/$name/"
          cp src/Sshelfy.App/Assets/sshelfy.png "artifacts/$name/sshelfy.png"
          chmod 644 "artifacts/$name"/*
          chmod 755 "artifacts/$name/sshelfy" "artifacts/$name/install.sh"
          tar -czf "artifacts/release/$name.tar.gz" -C artifacts "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/release/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/release
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts/release
        run: |
          sha256sum -- *.exe *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes from the changelog
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]").LineNumber
          if ($start) {
            $rest = $lines[$start..($lines.Count - 1)]
            $end = ($rest | Select-String -Pattern '^## \[').LineNumber | Select-Object -First 1
            $notes = if ($end) { $rest[0..($end - 2)] } else { $rest }
          } else {
            $notes = @("See CHANGELOG.md.")
          }
          $notes | Set-Content artifacts/notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" artifacts/release/* \
            --title "sshelfy $version" --notes-file artifacts/notes.md
