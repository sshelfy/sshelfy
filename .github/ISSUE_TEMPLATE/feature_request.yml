name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the task or problem, not only the solution. What do you do today instead?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could sshelfy help?
  - type: textarea
    id: other
    attributes:
      label: Other apps that do this well
      description: Termius, MobaXterm, WindTerm, Windows Terminal… links or screenshots help.
